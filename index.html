  #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #1a1511 0%, #070605 70%); color: #d8ccb0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    transition: opacity .45s; padding: 0 16px; box-sizing: border-box; text-align: center; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .loading-title { font-family: 'Special Elite', monospace; font-size: clamp(40px, 9vw, 72px); color: #e8dcc0; letter-spacing: 2px; text-shadow: 3px 3px 0 #7a1410; }

  #loading .loading-fill { height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, #9a2a1c 0 10px, #7a1c12 10px 20px); background-size: 28px 28px;
    animation: loadstripe 0.8s linear infinite; transition: width .25s ease-out; box-shadow: 0 0 10px rgba(200, 60, 30, .45); }
  @keyframes loadstripe { to { background-position: 28px 0; } }
  #loading .loading-row { width: min(460px, 86vw); display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 15px; color: #8f8470; letter-spacing: .5px; text-transform: uppercase; }

<script>
  // Test sessions (?dev or ?mute) are silent: every AudioContext stays suspended
  // and speech synthesis is a no-op, whichever module creates them.
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.has('dev') && !q.has('mute')) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      var Muted = class extends AC {
        constructor(o) { super(o); super.suspend(); }
        resume() { return Promise.resolve(); }
      };
      window.AudioContext = Muted;
      window.webkitAudioContext = Muted;
    }
    if (window.speechSynthesis) window.speechSynthesis.speak = function () {};
    var A = window.Audio;
    if (A) window.Audio = function () { var a = new A(); a.muted = true; return a; };
  })();
</script>

  <div class="loading-sub">scraping the city off the pavement...</div>
</div>
<script>
  // Loading screen: window.__loading.progress(fraction 0..1, stepLabel), .done(), .fail(msg).
  // The first third of the bar is the module download (counted as each preloaded module arrives);
  // the rest is driven by boot() in src/main.js (world build stages, each module install, shader warm-up).
  (function () {
    var root = document.getElementById('loading');
    var fill = root.querySelector('.loading-fill'), pct = root.querySelector('.loading-pct');
    var step = root.querySelector('.loading-step'), sub = root.querySelector('.loading-sub');
    var TIPS = [
      "Tip: The bank can't rob you if you're already broke. Checkmate, capitalism.",
      'Tip: Energy drinks count as a meal if you believe hard enough.',
      'Tip: One star and the cops jog after you. Five stars and the sky starts asking questions.',
      'Tip: Break line of sight to shake the cops. Hiding behind a hobo counts.',
      "Tip: Hold C to block. Or don't, and let your face do it.",
      'Tip: Z rolls out of the way. Rolling into traffic is also, technically, out of the way.',
      "Tip: Low on HP? Y quick-heals. Low on dignity? There's no key for that.",
      'Tip: Street product is cheaper in some districts than others. Buy low, sell high, run fast.',
      'Tip: F steals a car. Pressing F again does not un-steal it.',
      'Tip: Send your friends an invite link and ruin their evening too. Co-op!',
      'Tip: Sleep at home. Energy comes back. Self-respect is sold separately.',
      'Tip: Heists pay big. Prison food does not.',
      'Tip: Choppy? Esc → Graphics. Your laptop fan will send a thank-you card.',
      'Loading: teaching the pigeons to steal fries...',
      'Loading: rusting the fire escapes to city code...',
      "Loading: misplacing this year's road budget...",
      'Loading: calibrating the smog to "eye-watering"...',
      'Loading: hiring the cheapest contractors in Rotwell...',
      'Loading: refilling the potholes with fresh potholes...',
      'Loading: bribing the building inspector (again)...',
    ];
    var cur = 0, shown = -1, tipI = Math.floor(Math.random() * TIPS.length), obs = null;
    function tip() { tipI = (tipI + 1) % TIPS.length; sub.style.opacity = '0'; setTimeout(function () { sub.textContent = TIPS[tipI]; sub.style.opacity = '1'; }, 300); }
    sub.textContent = TIPS[tipI];
    var tipT = setInterval(tip, 3600);
    function draw() { if (cur > shown) { shown = cur; fill.style.width = (shown * 100).toFixed(1) + '%'; pct.textContent = Math.floor(shown * 100) + '%'; } }
    var api = window.__loading = {
      t0: performance.now(),
      progress: function (f, label) { if (f > cur) cur = Math.min(1, f); if (label) step.textContent = label; draw(); },
      done: function () { api.progress(1, 'here we go'); clearInterval(tipT); if (obs) obs.disconnect(); root.classList.add('done'); setTimeout(function () { root.remove(); }, 500); },
      fail: function (msg) { clearInterval(tipT); if (obs) obs.disconnect(); step.textContent = 'it broke'; sub.style.opacity = '1'; sub.textContent = msg; },
    };
    // module download progress: count arriving scripts against the preload list
    var want = document.querySelectorAll('link[rel=modulepreload]').length || 120, got = 0;
    try {
      obs = new PerformanceObserver(function (list) {
        list.getEntries().forEach(function (e) { if (/\.js(\?|$)/.test(e.name)) got++; });
        if (cur < 0.35) api.progress(Math.min(0.34, (got / want) * 0.34), got < want ? 'downloading the city... ' + Math.min(got, want) + '/' + want : 'unpacking...');
      });
      obs.observe({ type: 'resource', buffered: true });
    } catch (e) { /* old browser: the bar starts at the boot steps */ }
  })();
</script>
